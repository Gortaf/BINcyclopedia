<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immune System Atlas | BINcyclopedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: dark lab-bench canvas, diagram on the left, dossier panel on the right. Lineage colors carry meaning. */
:root {
  color-scheme: dark;
  --bg: #0d1117;
  --surface: #151b24;
  --surface-2: #1c2431;
  --line: #2a3445;
  --text: #e6e9ef;
  --muted: #8d99ac;
  --accent: #f2c14e;
  --c-prog: #b9b3a6;
  --c-myeloid: #ee7650;
  --c-apc: #e9b44c;
  --c-innate: #4cc2a0;
  --c-t: #5aa2ec;
  --c-b: #b680e4;
  --c-sol: #ec6c9c;
  --c-target: #8b96a7;
  --c-pathogen: #b2713f;
  --display: "Fraunces", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 24px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
}
.home-link {
  color: var(--muted);
  text-decoration: none;
  font: 500 12.5px var(--mono);
  letter-spacing: 0.5px;
}
.home-link:hover { color: var(--accent); }
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 24px;
  margin: 0;
  letter-spacing: 0.2px;
  text-wrap: balance;
}
h1 small {
  font-family: var(--mono);
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
  margin-left: 10px;
}
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font: 500 12.5px var(--body);
  cursor: pointer;
}
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
.chip:hover { border-color: var(--c); }
.chip[aria-pressed="false"] { opacity: 0.4; }
.chip:focus-visible, .node:focus-visible, button:focus-visible, input:focus-visible, .rel:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
#search {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  padding: 6px 11px;
  font: 400 13px var(--body);
  width: 190px;
}
main { flex: 1; min-height: 0; display: flex; }
#stage { flex: 1; min-width: 0; min-height: 280px; overflow: hidden; position: relative; touch-action: none; }
#stage svg { display: block; width: 100%; height: 100%; cursor: grab; user-select: none; }
#stage svg.panning { cursor: grabbing; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 9px 20px; border-bottom: 1px solid var(--line); }
.toolbar .controls { margin-left: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--surface); color: var(--muted); border: 0; border-right: 1px solid var(--line); padding: 6px 13px; font: 500 12.5px var(--body); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #0d1117; }
.btn { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 13px; font: 500 12.5px var(--body); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn[aria-pressed="true"] { background: var(--accent); color: #0d1117; border-color: var(--accent); }
.spacer { flex: 1; }
.hero { width: 100%; max-width: 150px; height: auto; display: block; margin: 0 auto 4px; }
#panel {
  width: 410px;
  flex: none;
  border-left: 1px solid var(--line);
  background: var(--surface);
  overflow-y: auto;
  padding: 20px 22px 28px;
}
#panel h2 { font-family: var(--display); font-size: 26px; line-height: 1.15; margin: 6px 0 4px; text-wrap: balance; }
#panel h3 {
  font: 500 11px var(--mono);
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--muted);
  margin: 20px 0 6px;
}
#panel p { margin: 0 0 8px; }
.badge {
  display: inline-block;
  font: 500 11px var(--mono);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 2px 9px;
  border-radius: 4px;
  color: #0d1117;
  background: var(--c);
}
.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font: 400 12px var(--mono);
  padding: 2px 8px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface-2);
}
.rel {
  display: flex;
  gap: 8px;
  align-items: baseline;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  padding: 6px 2px;
  color: var(--text);
  font: 400 13.5px var(--body);
  cursor: pointer;
}
.rel:hover { background: var(--surface-2); }
.rel b { color: var(--c); font-weight: 600; white-space: nowrap; }
.rel span { color: var(--muted); font-size: 12.5px; }
.dir { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.note {
  border-left: 3px solid var(--accent);
  background: var(--surface-2);
  padding: 8px 12px;
  border-radius: 0 6px 6px 0;
  font-size: 14px;
}
#hint { color: var(--muted); }
#hint h2 { color: var(--text); }
.legend { display: grid; gap: 7px; margin-top: 10px; }
.edge-legend {
  position: absolute;
  right: 12px;
  top: 12px;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 9px;
  max-width: 140px;
  z-index: 5;
}
.edge-legend .legend-toggle {
  display: block;
  width: 100%;
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
  font: 500 10px var(--mono);
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
}
.edge-legend .legend-toggle:hover { color: var(--text); }
.edge-legend .legend { margin-top: 6px; gap: 4px; grid-template-columns: minmax(0, 1fr); }
.edge-legend.collapsed .legend { display: none; }
.edge-legend .legend div { font-size: 10.5px; gap: 5px; }
.edge-legend .legend svg { width: 28px !important; height: 9px !important; flex: none; }
.edge-legend .legend span { flex: 1; min-width: 0; }
.legend div { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.legend svg { width: 46px; height: 12px; flex: none; }
.node { cursor: pointer; transition: opacity 0.35s; }
.node .gfx { transition: filter 0.2s; }
.node:hover .gfx { filter: brightness(1.18); }
.node .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0; transition: opacity 0.2s; }
.node:hover .ring { opacity: 0.35; }
.node.sel .ring { opacity: 1; }
.node:focus-visible { outline: none; }
.node:focus-visible .ring { opacity: 1; }
.node .lbl { font: 600 13.5px var(--body); fill: var(--text); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4.5px; stroke-linejoin: round; pointer-events: none; }
.node.sel .lbl { fill: var(--accent); }
.node.dim { opacity: 0.16; }
.node.gone { opacity: 0; pointer-events: none; }
.backdrop { transition: opacity 0.4s; pointer-events: none; }
.backdrop rect { stroke-width: 1.2; }
.backdrop text { font: 500 12px var(--mono); letter-spacing: 2.5px; text-transform: uppercase; }
#zones { transition: opacity 0.4s; }
.edge { fill: none; stroke-width: 1.4; opacity: 0.22; transition: opacity 0.2s; }
.edge.on { opacity: 0.95; stroke-width: 2; }
.edge.off { opacity: 0.04; }
.edge.gone { display: none; }
.elabel { pointer-events: none; }
.elabel rect { fill: var(--bg); fill-opacity: 0.94; stroke-width: 1.4; }
.elabel text { font: 500 11px var(--mono); fill: var(--text); text-anchor: middle; }
.zone { font: 500 12px var(--mono); letter-spacing: 3px; fill: var(--muted); opacity: 0.55; }
.zonebox { fill: none; stroke: var(--line); stroke-dasharray: 4 6; }
@media (max-width: 900px) {
  main { flex-direction: column; }
  #panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); max-height: 55%; }
  .controls { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <a href="../../index.html" class="home-link">&larr; BINcyclopedia</a>
  <h1>Immune System Atlas<small>click any cell</small></h1>
  <input id="search" type="search" placeholder="Search cell, marker, cytokine" aria-label="Search" style="margin-left:auto">
</header>
<div class="toolbar">
  <div class="controls" id="chips"></div>
  <span class="spacer"></span>
  <div class="seg" id="layout" role="group" aria-label="Layout">
    <button data-mode="lineage" aria-pressed="true">Lineage</button>
    <button data-mode="category" aria-pressed="false">Categories</button>
    <button data-mode="network" aria-pressed="false">Network</button>
  </div>
  <button class="btn" id="focusBtn" aria-pressed="false" disabled title="Select a cell first">Focus on selection</button>
  <button class="btn" id="fitBtn">Fit to view</button>
</div>
<main>
  <div id="stage">
    <svg id="svg" viewBox="0 0 1600 1060" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Immune system relationship diagram"></svg>
    <div id="edgeLegend" class="edge-legend" aria-label="Edge type legend"></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const GROUPS = {
  prog: { name: "Progenitors", color: "var(--c-prog)" },
  myeloid: { name: "Myeloid innate", color: "var(--c-myeloid)" },
  apc: { name: "Antigen presenting", color: "var(--c-apc)" },
  innate: { name: "Lymphoid innate", color: "var(--c-innate)" },
  t: { name: "T cells", color: "var(--c-t)" },
  b: { name: "B cells", color: "var(--c-b)" },
  sol: { name: "Soluble factors", color: "var(--c-sol)" },
  target: { name: "Self (altered)", color: "var(--c-target)" },
  pathogen: { name: "Pathogens", color: "var(--c-pathogen)" }
}
const NODES = []
const EDGES = []
const N = o => NODES.push(o)
const E = (a, b, type, label, curve) => EDGES.push({ a, b, type, label, curve: curve || 0 })

N({
  id: "hsc", name: "HSC", g: "prog", x: 800, y: 60,
  sub: "Haematopoietic stem cell",
  markers: ["CD34+", "CD38-", "CD90+", "CD49f+", "Lin-", "c-Kit+ (mouse: LSK, SLAM)"],
  where: "Bone marrow niche (adult), fetal liver and AGM during development",
  roles: [
    "This is the ancestral cell, sitting in the bone marrow, that every other blood and immune cell in the body ultimately descends from.",
    "Self-renews and gives rise to every blood and immune lineage. In adults it lives in perivascular and endosteal niches of the marrow, kept going by CXCL12-abundant reticular cells, SCF and TPO.",
    "Long-term HSCs mostly sit quiescent. Infection, IFN and IL-1 push them into cycle and tilt output toward myeloid cells (emergency myelopoiesis)."
  ],
  products: ["Cell fate set by PU.1, GATA1/2, C/EBPα, IKZF1, RUNX1"],
  notes: "BCG and β-glucan can imprint trained immunity at the HSC and progenitor level, which is why innate memory outlasts the short life of a mature monocyte."
})
N({
  id: "cmp", name: "CMP / GMP", g: "prog", x: 400, y: 190,
  sub: "Common myeloid and granulocyte-monocyte progenitors",
  markers: ["CD34+", "CD38+", "CD123 int", "CD45RA- (CMP) / + (GMP)"],
  where: "Bone marrow",
  roles: [
    "This progenitor has already committed to becoming a myeloid cell: the branch of white blood cells that includes neutrophils, monocytes and dendritic cells, rather than lymphocytes like T and B cells.",
    "Commits to the erythroid, megakaryocytic, granulocytic or monocytic lineages.",
    "GMPs make neutrophils, eosinophils, basophils, mast cell precursors and monocytes under G-CSF, GM-CSF, M-CSF and IL-3.",
    "A parallel CDP branch gives the conventional and plasmacytoid DCs, driven by FLT3L."
  ],
  products: ["Lineage choice driven by C/EBPα, PU.1 dose, GATA1, IRF8"],
  notes: "The classical tree is a simplification. Single-cell data fit a continuum in which lineage bias builds up gradually, and the myeloid-lymphoid split is blurrier than textbooks draw it (lymphoid-primed multipotent progenitors keep myeloid potential)."
})
N({
  id: "clp", name: "CLP", g: "prog", x: 1200, y: 190,
  sub: "Common lymphoid progenitor",
  markers: ["Lin-", "CD127 (IL-7Rα)+", "FLT3+", "CD10+ (human)", "Sca-1 lo, c-Kit lo (mouse)"],
  where: "Bone marrow, then thymus (T) or marrow (B)",
  roles: [
    "This progenitor has committed to the lymphoid branch instead: the lineage that produces T cells, B cells, and NK cells.",
    "Gives rise to B cells, T cell precursors, NK cells and ILCs.",
    "T lineage commitment happens after the progenitors reach the thymus, where Notch1 signals from cortical thymic epithelium switch on TCF-1, GATA3 and BCL11B.",
    "B lineage commitment happens in the marrow and needs E2A, EBF1 and PAX5."
  ],
  products: ["IL-7 dependence for survival and proliferation"],
  notes: "ILC progenitors (ILCP, PLZF+, ID2+) branch off early and leave the marrow already committed to the innate fate."
})
N({
  id: "neut", name: "Neutrophil", g: "myeloid", x: 90, y: 350,
  sub: "Polymorphonuclear first responder",
  markers: ["CD66b+", "CD15+", "CD16 hi", "Ly6G (mouse)", "CXCR2+"],
  where: "Blood (40 to 70% of leukocytes), rapidly recruited to tissue. Lifespan around a day in blood.",
  roles: [
    "This is the most abundant white blood cell in the body, and usually the very first immune cell to arrive at an infection or injury.",
    "First cell on the scene at infections and sterile injury, called in by CXCL8 (IL-8), C5a, LTB4 and fMLP.",
    "Kills by phagocytosis, the NOX2 and MPO oxidative burst, and degranulation of azurophilic, specific and gelatinase granules.",
    "It can also expel decondensed chromatin studded with histones and granule proteins (NETosis), which traps microbes.",
    "Makes IL-1β, TNF and chemokines that pull in monocytes and influence T cell responses."
  ],
  products: ["MPO", "Elastase", "Lactoferrin", "Defensins", "LL-37", "ROS", "NETs"],
  notes: "CGD (NOX2 deficiency) means recurrent catalase-positive infections and granulomas. Neutrophil subsets such as low-density neutrophils and PMN-MDSCs depend heavily on context and are hotly debated in tumour immunology."
})
N({
  id: "eos", name: "Eosinophil", g: "myeloid", x: 230, y: 350,
  sub: "Anti-helminth and type 2 effector",
  markers: ["Siglec-8+", "CCR3+", "IL-5Rα+", "CD125", "EPX+"],
  where: "Blood (low), tissue resident in gut lamina propria, adipose tissue, thymus and uterus",
  roles: [
    "This white blood cell specialises in fighting parasites too large to be eaten by a single cell, and is also heavily involved in allergic disease.",
    "Kills helminths and other large parasites, often by antibody-dependent degranulation through FcεRI and FcγR.",
    "Stays alive on IL-5 and follows eotaxins (CCL11) through CCR3.",
    "Drives type 2 tissue inflammation in asthma and atopic disease, and also takes part in tissue repair and metabolic homeostasis."
  ],
  products: ["Major basic protein", "ECP", "EPX", "EDN", "IL-4", "IL-13", "TGF-β", "Charcot-Leyden crystals"],
  notes: "Anti-IL-5 (mepolizumab) and anti-IL-5Rα (benralizumab, which also drives ADCC against eosinophils) are used in severe eosinophilic asthma."
})
N({
  id: "baso", name: "Basophil", g: "myeloid", x: 370, y: 350,
  sub: "Rare circulating type 2 cell",
  markers: ["CD123+", "CD203c+", "FcεRI hi", "CD63 (activation)", "CD49b (mouse)"],
  where: "Blood (under 1%), recruited to inflamed skin and lung",
  roles: [
    "This is the rarest circulating white blood cell, and it works alongside mast cells to drive allergic reactions.",
    "Binds IgE on FcεRI. Allergen crosslinking triggers histamine release and fast IL-4 and IL-13 secretion.",
    "That early IL-4 can help bias naive CD4 T cells toward Th2 and support class switching to IgE.",
    "Contributes to the late phase of allergic responses and to immunity against ticks."
  ],
  products: ["Histamine", "IL-4", "IL-13", "LTC4", "TSLP response"],
  notes: "The basophil activation test (CD63 or CD203c upregulation by flow cytometry) gives a functional readout of allergen sensitisation."
})
N({
  id: "mast", name: "Mast cell", g: "myeloid", x: 510, y: 350,
  sub: "Tissue sentinel of barriers",
  markers: ["c-Kit (CD117) hi", "FcεRI hi", "Tryptase / chymase", "MRGPRX2"],
  where: "Skin, mucosae, around vessels and nerves. Mature in tissue, not in blood.",
  roles: [
    "This cell lives permanently in tissues like skin and gut lining, and its sudden release of stored chemicals is what causes the immediate symptoms of an allergic reaction.",
    "IgE-dependent degranulation drives immediate (type I) hypersensitivity. C3a, C5a, neuropeptides and MRGPRX2 ligands can trigger it without IgE.",
    "Preformed granule mediators act within seconds, and lipid mediators (PGD2, LTC4) and cytokines (TNF, IL-6, IL-13) follow.",
    "Mast cells also detoxify venoms, defend against bacteria and recruit neutrophils and DCs to the site."
  ],
  products: ["Histamine", "Heparin", "Tryptase", "Chymase", "PGD2", "LTC4", "TNF"],
  notes: "Serum tryptase is the clinical marker for anaphylaxis and mastocytosis (KIT D816V). Omalizumab (anti-IgE) lowers FcεRI expression on mast cells and basophils."
})
N({
  id: "mono", name: "Monocyte", g: "myeloid", x: 650, y: 350,
  sub: "Circulating precursor of macrophages and DCs",
  markers: ["CD14 / CD16 (classical, intermediate, non-classical)", "CCR2+ (classical)", "Ly6C hi (mouse)", "CX3CR1"],
  where: "Blood, spleen reservoir, recruited to inflamed tissue",
  roles: [
    "This cell circulates in the blood as a reservoir, ready to turn into either a macrophage or a dendritic cell once it moves into a tissue.",
    "Classical (CD14++CD16-) monocytes leave the marrow through CCR2-CCL2, enter inflamed tissue and become macrophages or monocyte-derived DCs.",
    "Non-classical (CD14+CD16++) monocytes crawl along the endothelium using LFA-1 and CX3CR1 and clear damaged cells.",
    "On TLR4 or TLR2 sensing they secrete IL-1β, IL-6 and TNF."
  ],
  products: ["IL-1β", "IL-6", "TNF", "CCL2"],
  notes: "Many tissue macrophages (microglia, Kupffer cells, Langerhans cells, alveolar macrophages) are embryonic in origin and maintain themselves at steady state. They don't come from monocytes."
})
N({
  id: "mac", name: "Macrophage", g: "myeloid", x: 600, y: 520,
  sub: "Tissue phagocyte, sentinel and tuner",
  markers: ["CD68", "CD64 (FcγRI)", "F4/80 (mouse)", "CD163 (M2-like)", "MerTK"],
  where: "Every tissue. Kupffer cells (liver), alveolar (lung), microglia (CNS), Langerhans (skin), osteoclasts (bone), red pulp macrophages (spleen).",
  roles: [
    "This is the immune system's general-purpose scavenger cell, living permanently in every tissue of the body, where it swallows up microbes, debris and dying cells.",
    "Eats microbes, apoptotic cells (efferocytosis) and debris, and senses PAMPs and DAMPs through TLRs, NLRs, scavenger receptors and C-type lectins.",
    "IFN-γ and LPS push it toward an inflammatory program (iNOS, IL-12, IL-1β, TNF). IL-4 and IL-13 push it toward repair (Arg1, CD206, IL-10).",
    "Presents antigen on MHC II to CD4 T cells, though it primes naive cells less well than a DC does.",
    "Under sustained Th1 help it forms granulomas, as in tuberculosis."
  ],
  products: ["IL-1β", "IL-6", "TNF", "IL-12", "IL-10", "NO", "ROS", "VEGF"],
  notes: "M1 and M2 are fine shorthand for cultured cells but describe in vivo states poorly. scRNA-seq shows a spectrum, for example the lipid-associated and TREM2+ macrophages in tumours and obesity."
})
N({
  id: "cdc1", name: "cDC1", g: "apc", x: 940, y: 350,
  sub: "Cross-presenting conventional DC",
  markers: ["XCR1+", "CLEC9A+", "CD141 (BDCA-3)+", "CD8α / CD103 (mouse)", "IRF8, BATF3"],
  where: "Lymphoid organs and non-lymphoid tissue (migratory form)",
  roles: [
    "This dendritic cell subtype's specialty is showing material it has swallowed to CD8 T cells, which is essential for the immune system to start attacking virus-infected or cancerous cells.",
    "Specialised for cross-presentation: loads exogenous antigen (for example from dead tumour cells taken up through CLEC9A) onto MHC I to prime naive CD8 T cells.",
    "Main source of IL-12, which drives Th1 differentiation and IFN-γ production by NK and T cells.",
    "Needed for anti-tumour immunity and for checkpoint blockade to work in many mouse models. NK-derived CCL5 and XCL1 recruit it into tumours."
  ],
  products: ["IL-12", "CXCL9", "CXCL10", "Type III IFN"],
  notes: "Batf3-/- mice lack cDC1, which makes them the standard test for whether a response needs cross-priming."
})
N({
  id: "cdc2", name: "cDC2", g: "apc", x: 800, y: 350,
  sub: "Conventional DC, CD4 T cell activator",
  markers: ["CD11b+", "SIRPα (CD172a)+", "CD1c (BDCA-1)+", "IRF4+"],
  where: "Lymphoid organs and tissues, the most abundant DC subset in humans",
  roles: [
    "This is the most common dendritic cell subtype in humans, and its main job is to activate CD4 helper T cells by showing them fragments of antigen it has processed.",
    "Presents peptide on MHC II to naive CD4 T cells in the T cell zone of lymph nodes.",
    "Polarises the CD4 response through the cytokines it makes: IL-12 for Th1, IL-23 and IL-6 for Th17, and TSLP-conditioned or IRF4-dependent signals for Th2.",
    "Once mature, it migrates from tissue to the draining lymph node along CCR7-CCL19 and CCL21 gradients."
  ],
  products: ["IL-12", "IL-23", "IL-1β", "IL-6", "OX40L"],
  notes: "Think of three signals: peptide-MHC (1), CD80/CD86 with CD28 (2) and polarising cytokines (3). An immature DC giving signal 1 without signal 2 tends to induce tolerance or Treg."
})
N({
  id: "pdc", name: "pDC", g: "apc", x: 1080, y: 350,
  sub: "Plasmacytoid DC, the type I IFN factory",
  markers: ["CD123+", "BDCA-2 (CD303)+", "BDCA-4", "TLR7, TLR9 hi", "E2-2 (TCF4)"],
  where: "Blood and lymphoid organs, recruited to inflamed skin and mucosae",
  roles: [

/* ## Cell artwork: flat vector cells, generated from small recipes ## */
const HEX = { prog: "#c9c2b2", myeloid: "#f07a52", apc: "#f0b84e", innate: "#4fc9a4", t: "#5ca6ee", b: "#b884e8", sol: "#ee6f9f", target: "#93a0b3", pathogen: "#c17f4a" }
const hx = h => {
  if (h.length === 4) h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3]
  return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16))
}
const mix = (a, b, t) => {
  const A = hx(a)
  const B = hx(b)
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("")
}
const f1 = v => +v.toFixed(1)
const rng = seed => {
  let s = 7
  for (let i = 0; i < seed.length; i++) s = (Math.imul(s, 31) + seed.charCodeAt(i)) >>> 0
  return () => {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0
    return s / 4294967296
  }
}
const rad = d => d * Math.PI / 180

const blob = (r, n, amp, rnd) => {
  const pts = []
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2
    const rr = r * (1 + amp * (rnd() * 2 - 1))
    pts.push([rr * Math.cos(a), rr * Math.sin(a)])
  }
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]
  let d = ""
  for (let i = 0; i < n; i++) {
    const p = pts[i]
    const m0 = mid(pts[(i + n - 1) % n], p)
    const m1 = mid(p, pts[(i + 1) % n])
    d += (i ? "" : `M${f1(m0[0])} ${f1(m0[1])}`) + `Q${f1(p[0])} ${f1(p[1])} ${f1(m1[0])} ${f1(m1[1])}`
  }
  return d + "Z"
}

/* ## drawing helpers, T is the per-cell context { k, c, rnd, nc, lt, dk } ## */
const B = (T, r, amp = 0.03, n = 16) =>
  `<path d="${blob(r, n, amp, T.rnd)}" fill="url(#g-${T.k})"/>` +
  `<ellipse cx="${f1(-r * 0.3)}" cy="${f1(-r * 0.36)}" rx="${f1(r * 0.36)}" ry="${f1(r * 0.2)}" transform="rotate(-35 ${f1(-r * 0.3)} ${f1(-r * 0.36)})" fill="#fff" opacity="0.2"/>`
const Nround = (T, r, ox = 0, oy = 0) =>
  `<circle cx="${ox}" cy="${oy}" r="${r}" fill="${T.nc}"/>` +
  `<circle cx="${f1(ox - r * 0.3)}" cy="${f1(oy - r * 0.3)}" r="${f1(r * 0.28)}" fill="#fff" opacity="0.14"/>` +
  `<circle cx="${f1(ox + r * 0.35)}" cy="${f1(oy + r * 0.25)}" r="${f1(r * 0.18)}" fill="#000" opacity="0.18"/>`
const Nlobes = (T, pts, r) =>
  `<path d="M${pts.map(p => p.join(" ")).join("L")}" stroke="${T.nc}" stroke-width="${f1(r * 0.55)}" stroke-linejoin="round" fill="none"/>` +
  pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${T.nc}"/><circle cx="${p[0] - 2}" cy="${p[1] - 2}" r="${f1(r * 0.3)}" fill="#fff" opacity="0.14"/>`).join("")
const Nbean = T => `<path d="M-13 7Q0 -15 13 6" stroke="${T.nc}" stroke-width="12" stroke-linecap="round" fill="none"/>`
const Dots = (T, n, r0, r1, s, fill, op) => {
  let o = ""
  for (let i = 0; i < n; i++) {
    const a = T.rnd() * Math.PI * 2
    const d = r0 + T.rnd() * (r1 - r0)
    o += `<circle cx="${f1(d * Math.cos(a))}" cy="${f1(d * Math.sin(a))}" r="${s}" fill="${fill}" opacity="${op}"/>`
  }
  return o
}
const Ring = (T, r, col, w, op, dash = "") =>
  `<circle r="${r}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`
const Yat = (x, y, rot, s, col, w = 2.2) =>
  `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)})" stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"><path d="M0 0V${-s}M0 ${-s}l${f1(-0.62 * s)} ${f1(-0.6 * s)}M0 ${-s}l${f1(0.62 * s)} ${f1(-0.6 * s)}"/></g>`
const Yrim = (T, count, r, s, col, start = -90, w = 2.2) => {
  let o = ""
  for (let i = 0; i < count; i++) {
    const a = start + i * 360 / count
    o += Yat((r - 1) * Math.cos(rad(a)), (r - 1) * Math.sin(rad(a)), a + 90, s, col, w)
  }
  return o
}
const Lolli = (T, count, r, s, col, start = -90) => {
  let o = ""
  for (let i = 0; i < count; i++) {
    const a = rad(start + i * 360 / count)
    const x0 = (r - 1) * Math.cos(a)
    const y0 = (r - 1) * Math.sin(a)
    o += `<line x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x0 + s * Math.cos(a))}" y2="${f1(y0 + s * Math.sin(a))}" stroke="${col}" stroke-width="2" stroke-linecap="round"/><circle cx="${f1(x0 + s * Math.cos(a))}" cy="${f1(y0 + s * Math.sin(a))}" r="3.4" fill="${col}"/>`
  }
  return o
}
const Stubs = (T, count, r, len, col, start) => {
  let o = ""
  for (let i = 0; i < count; i++) {
    const a = rad(start + i * 22)
    o += `<line x1="${f1((r - 1) * Math.cos(a))}" y1="${f1((r - 1) * Math.sin(a))}" x2="${f1((r + len) * Math.cos(a))}" y2="${f1((r + len) * Math.sin(a))}" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`
  }
  return o
}
const Bars = (T, count, r, col, start) => {
  let o = ""
  for (let i = 0; i < count; i++) {
    const a = start + i * 50
    o += `<g transform="rotate(${a})" stroke="${col}" stroke-width="2.6" stroke-linecap="round"><path d="M${r} 0H${r + 8}M${r + 8} -5V5"/></g>`
  }
  return o
}
const shape = (kind, x, y, s, col) => {
  const p = pts => `<polygon points="${pts.map(q => q.map(f1).join(",")).join(" ")}" fill="${col}"/>`
  if (kind === "star") return p([[x, y - s], [x + s * 0.3, y - s * 0.3], [x + s, y], [x + s * 0.3, y + s * 0.3], [x, y + s], [x - s * 0.3, y + s * 0.3], [x - s, y], [x - s * 0.3, y - s * 0.3]])
  if (kind === "tri") return p([[x, y - s], [x + s, y + s * 0.8], [x - s, y + s * 0.8]])
  if (kind === "square") return p([[x - s * 0.8, y - s * 0.8], [x + s * 0.8, y - s * 0.8], [x + s * 0.8, y + s * 0.8], [x - s * 0.8, y + s * 0.8]])
  if (kind === "diamond") return p([[x, y - s], [x + s, y], [x, y + s], [x - s, y]])
  return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(s * 0.8)}" fill="${col}"/>`
}
const Emit = (T, kind, n, r0, r1, s, col, a0, spread) => {
  let o = ""
  for (let i = 0; i < n; i++) {
    const a = rad(a0 + (i / Math.max(1, n - 1) - 0.5) * spread)
    const d = r0 + (r1 - r0) * (i % 2 ? 1 : 0.35) + (T.rnd() - 0.5) * 5
    o += shape(kind, d * Math.cos(a), d * Math.sin(a), s * (0.8 + T.rnd() * 0.5), col)
  }
  return o
}
const Arms = (T, n, r0, len, w, curl) => {
  let o = ""
  for (let i = 0; i < n; i++) {
    const a = rad(i * 360 / n + (T.rnd() - 0.5) * 14 + 8)
    const l = len * (0.82 + T.rnd() * 0.3)
    const tx = l * Math.cos(a)
    const ty = l * Math.sin(a)
    const cx = (r0 + l) / 2 * Math.cos(a + curl)
    const cy = (r0 + l) / 2 * Math.sin(a + curl)
    o += `<path d="M0 0Q${f1(cx)} ${f1(cy)} ${f1(tx)} ${f1(ty)}" stroke="${mix(T.c, "#000", 0.08)}" stroke-width="${w}" stroke-linecap="round" fill="none"/>` +
      `<path d="M${f1(tx * 0.72)} ${f1(ty * 0.72)}l${f1(8 * Math.cos(a + 0.9))} ${f1(8 * Math.sin(a + 0.9))}M${f1(tx * 0.8)} ${f1(ty * 0.8)}l${f1(8 * Math.cos(a - 0.9))} ${f1(8 * Math.sin(a - 0.9))}" stroke="${mix(T.c, "#000", 0.08)}" stroke-width="${f1(w * 0.55)}" stroke-linecap="round"/>`
  }
  return o
}
const tcell = (T, r, rim) => B(T, r, 0.03) + Nround(T, r * 0.6, 0, 0) + rim
const star8 = (x, y, ro, ri, n) => {
  const pts = []
  for (let i = 0; i < n * 2; i++) {
    const a = i * Math.PI / n
    const rr = i % 2 ? ri : ro
    pts.push(`${f1(x + rr * Math.sin(a))},${f1(y - rr * Math.cos(a))}`)
  }
  return pts.join(" ")
}

const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag)
  for (const k in attrs) e.setAttribute(k, attrs[k])
  if (parent) parent.appendChild(e)
  return e
}

NODES.forEach(n => {

const defs = el("defs", {}, svg)

/* ## Drawing positions and edges ## */
function drawEdge(item) {
  const { e, p } = item
  const a = cur[e.a]
  const b = cur[e.b]
  const na = byId[e.a]
  const nb = byId[e.b]
  const dx = b.x - a.x
  const dy = b.y - a.y
  const k = e.curve || 0.06
  const c = { x: (a.x + b.x) / 2 - dy * k, y: (a.y + b.y) / 2 + dx * k }
  const clip = (o, r, m) => {
    const vx = c.x - o.x
    const vy = c.y - o.y
    const l = Math.hypot(vx, vy) || 1
    return { x: o.x + vx / l * (r + m), y: o.y + vy / l * (r + m) }
  }
  const s = clip(a, na.r, 3)
  const t = clip(b, nb.r, 7)
  p.setAttribute("d", `M${f1(s.x)} ${f1(s.y)}Q${f1(c.x)} ${f1(c.y)} ${f1(t.x)} ${f1(t.y)}`)
  const u = 0.55
  item.ax = (1 - u) * (1 - u) * s.x + 2 * u * (1 - u) * c.x + u * u * t.x
  item.ay = (1 - u) * (1 - u) * s.y + 2 * u * (1 - u) * c.y + u * u * t.y
}

/* Pills sit on their arrow, then push apart from each other and from cells and cell names */
function placeLabels() {
  const L = edgeEls.filter(it => it.on)
  if (!L.length) return
  L.forEach(it => { it.x = it.ax; it.y = it.ay })
  const obs = []
  vis.forEach(id => {
    const n = byId[id]
    const p = cur[id]
    obs.push({ x: p.x, y: p.y, hw: n.r + 6, hh: n.r + 6 })
    obs.push({ x: p.x, y: p.y - n.r - 17, hw: n.name.length * 4.3 + 6, hh: 11 })
  })
  for (let k = 0; k < 70; k++) {
    for (let i = 0; i < L.length; i++) {
      const a = L[i]
      for (let j = i + 1; j < L.length; j++) {
        const b = L[j]
        const ox = (a.w + b.w) / 2 + 4 - Math.abs(a.x - b.x)
        const oy = 22 - Math.abs(a.y - b.y)
        if (ox > 0 && oy > 0) {
          if (oy < ox) {
            const sg = a.y <= b.y ? -1 : 1
            a.y += sg * oy / 2
            b.y -= sg * oy / 2
          } else {
            const sg = a.x <= b.x ? -1 : 1
            a.x += sg * ox / 2
            b.x -= sg * ox / 2
          }
        }
      }
      obs.forEach(o => {
        const ox = a.w / 2 + o.hw - Math.abs(a.x - o.x)
        const oy = 9 + o.hh - Math.abs(a.y - o.y)
        if (ox > 0 && oy > 0) {
          if (oy < ox) a.y += (a.y >= o.y ? 1 : -1) * oy
          else a.x += (a.x >= o.x ? 1 : -1) * ox
        }
      })
      a.x += (a.ax - a.x) * 0.03
      a.y += (a.ay - a.y) * 0.03
    }
  }
  L.forEach(it => {
    it.lab.setAttribute("transform", `translate(${f1(it.x)} ${f1(it.y)})`)
    const far = Math.hypot(it.x - it.ax, it.y - it.ay) > 16
    it.lead.setAttribute("visibility", far ? "visible" : "hidden")
    if (far) {
      it.lead.setAttribute("x1", f1(it.ax))
      it.lead.setAttribute("y1", f1(it.ay))
      it.lead.setAttribute("x2", f1(it.x))
      it.lead.setAttribute("y2", f1(it.y))
    }
  })
}
function drawAll() {
  NODES.forEach(n => nodeEls[n.id].setAttribute("transform", `translate(${f1(cur[n.id].x)} ${f1(cur[n.id].y)})`))
  edgeEls.forEach(drawEdge)
  placeLabels()
}
function applyView() {
  const W = stage.clientWidth || 1000
  const H = stage.clientHeight || 600
  const h = view.w * H / W
  svg.setAttribute("viewBox", `${f1(view.cx - view.w / 2)} ${f1(view.cy - h / 2)} ${f1(view.w)} ${f1(h)}`)
}

/* ## Layouts: each returns { pos, ids, boxes } for the visible nodes ## */
const GORDER = ["prog", "myeloid", "apc", "innate", "t", "b", "sol", "target", "pathogen"]
const baseVisible = () => NODES.filter(n => !hiddenGroups.has(n.g)).map(n => n.id)

function layoutLineage(ids) {
  const pos = {}
  ids.forEach(id => { pos[id] = { x: byId[id].x, y: byId[id].y } })
  return { pos, ids, boxes: null }
}

function layoutCategory(ids) {
  const pos = {}
  const blocks = []
  const sx = 124
  const sy = 124
  GORDER.forEach(k => {
    const mem = ids.filter(id => byId[id].g === k)
    if (!mem.length) return
    const cols = mem.length <= 4 ? mem.length : mem.length <= 8 ? 4 : 5
    const rows = Math.ceil(mem.length / cols)
    blocks.push({ k, mem, cols, rows, w: cols * sx + 36, h: rows * sy + 62 })
  })
  const maxW = 1700
  let x = 0
  let y = 0
  let rowH = 0
  const boxes = []
  blocks.forEach(b => {
    if (x > 0 && x + b.w > maxW) { x = 0; y += rowH + 34; rowH = 0 }
    b.mem.forEach((id, i) => {
      pos[id] = { x: x + 18 + sx / 2 + (i % b.cols) * sx, y: y + 58 + sy / 2 + Math.floor(i / b.cols) * sy - 14 }
    })
    boxes.push({ k: b.k, x, y, w: b.w, h: b.h })
    x += b.w + 34
    rowH = Math.max(rowH, b.h)
  })
  return { pos, ids, boxes }
}

function layoutNetwork(ids) {
  const P = ids.map(id => ({ id, x: byId[id].x + (byId[id].y % 7) * 3, y: byId[id].y + (byId[id].x % 5) * 3, vx: 0, vy: 0, g: byId[id].g, r: byId[id].r }))
  const idx = {}
  P.forEach((p, i) => { idx[p.id] = i })
  const links = EDGES.filter(e => idx[e.a] !== undefined && idx[e.b] !== undefined)
  const iters = 360
  for (let it = 0; it < iters; it++) {
    const a = 1 - it / iters
    for (let i = 0; i < P.length; i++) {
      for (let j = i + 1; j < P.length; j++) {
        const p = P[i]
        const q = P[j]
        let dx = p.x - q.x
        let dy = p.y - q.y
        const d2 = dx * dx + dy * dy + 0.5
        const d = Math.sqrt(d2)
        let fr = 60000 / d2
        const min = p.r + q.r + 95
        if (d < min) fr += (min - d) * 0.25
        dx /= d
        dy /= d
        p.vx += dx * fr * a
        p.vy += dy * fr * a
        q.vx -= dx * fr * a
        q.vy -= dy * fr * a
      }
    }
    links.forEach(e => {
      const p = P[idx[e.a]]
      const q = P[idx[e.b]]
      const dx = q.x - p.x
      const dy = q.y - p.y
      const d = Math.hypot(dx, dy) || 1
      const fs = (d - 250) * 0.02 * a
      p.vx += dx / d * fs
      p.vy += dy / d * fs
      q.vx -= dx / d * fs
      q.vy -= dy / d * fs
    })
    const cen = {}
    P.forEach(p => {
      const c = cen[p.g] || (cen[p.g] = { x: 0, y: 0, n: 0 })
      c.x += p.x
      c.y += p.y
      c.n++
    })
    P.forEach(p => {
      const c = cen[p.g]
      p.vx += (c.x / c.n - p.x) * 0.03 * a - p.x * 0.004
      p.vy += (c.y / c.n - p.y) * 0.03 * a - p.y * 0.004
      p.vx *= 0.8
      p.vy *= 0.8
      p.x += p.vx
      p.y += p.vy
    })
  }
  const pos = {}
  P.forEach(p => { pos[p.id] = { x: p.x, y: p.y } })
  return { pos, ids, boxes: null }
}

function neighborsOf(id) {
  const ins = []
  const outs = []
  const both = []
  const seen = {}
  EDGES.forEach(e => {
    if (e.a !== id && e.b !== id) return
    const o = e.a === id ? e.b : e.a
    if (hiddenGroups.has(byId[o].g)) return
    seen[o] = seen[o] || { i: false, o: false }
    if (e.a === id) seen[o].o = true
    else seen[o].i = true
  })
  for (const o in seen) (seen[o].i && seen[o].o ? both : seen[o].i ? ins : outs).push(o)
  return { ins, outs, both }
}

function layoutFocus(id) {
  const nb = neighborsOf(id)
  const pos = { [id]: { x: 0, y: 0 } }
  const col = (list, side) => {
    const per = 6
    const cols = Math.ceil(list.length / per)
    list.forEach((o, i) => {
      const c = Math.floor(i / per)
      const inCol = Math.min(per, list.length - c * per)
      pos[o] = { x: side * (330 + c * 150), y: (i % per - (inCol - 1) / 2) * 120 }
    })
  }
  col(nb.ins, -1)
  col(nb.outs, 1)
  nb.both.forEach((o, i) => { pos[o] = { x: (i - (nb.both.length - 1) / 2) * 140, y: i % 2 ? 250 : -250 } })
  return { pos, ids: Object.keys(pos), boxes: null }
}

function computeLayout() {
  if (focus && selected) return layoutFocus(selected)
  const ids = baseVisible()
  if (mode === "category") return layoutCategory(ids)
  if (mode === "network") return layoutNetwork(ids)
  return layoutLineage(ids)
}

function fitFor(layout) {
  let x0 = Infinity
  let x1 = -Infinity
  let y0 = Infinity
  let y1 = -Infinity
  layout.ids.forEach(id => {
    const p = layout.pos[id]
    const r = byId[id].r
    x0 = Math.min(x0, p.x - r - 22)
    x1 = Math.max(x1, p.x + r + 22)
    y0 = Math.min(y0, p.y - r - 34)
    y1 = Math.max(y1, p.y + r + 22)
  })
  if (layout.boxes) layout.boxes.forEach(b => { x0 = Math.min(x0, b.x - 10); x1 = Math.max(x1, b.x + b.w + 10); y0 = Math.min(y0, b.y - 10); y1 = Math.max(y1, b.y + b.h + 10) })
  if (mode === "lineage" && !(focus && selected)) { x0 = Math.min(x0, 10); y0 = Math.min(y0, 20) }
  const W = stage.clientWidth || 1000
  const H = stage.clientHeight || 600
  const w = Math.max((x1 - x0) * 1.04, (y1 - y0) * 1.04 * W / H, 1300)
  return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w }
}

/* ## Applying a layout with a tween ## */
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2

function applyLayout(instant) {
  const L = computeLayout()
  const newVis = new Set(L.ids)
  L.ids.forEach(id => { if (!vis.has(id)) cur[id] = { x: L.pos[id].x, y: L.pos[id].y } })
  vis = newVis
  const from = {}
  L.ids.forEach(id => { from[id] = { x: cur[id].x, y: cur[id].y } })
  const vFrom = { ...view }
  const vTo = fitFor(L)
  Object.keys(backdrops).forEach(k => {
    const bx = L.boxes && L.boxes.find(b => b.k === k)
    const g = backdrops[k]
    if (bx) {
      const r = g.querySelector("rect")
      r.setAttribute("x", bx.x)
      r.setAttribute("y", bx.y)
      r.setAttribute("width", bx.w)
      r.setAttribute("height", bx.h)
      const t = g.querySelector("text")
      t.setAttribute("x", bx.x + 20)
      t.setAttribute("y", bx.y + 30)
    }
    g.setAttribute("opacity", bx ? 1 : 0)
  })
  zonesG.style.opacity = mode === "lineage" && !(focus && selected) ? 1 : 0
  refresh()
  if (instant) {
    L.ids.forEach(id => { cur[id] = { x: L.pos[id].x, y: L.pos[id].y } })
    view = vTo
    drawAll()
    applyView()
    return
  }
  const t0 = performance.now()
  const token = {}
  anim = token
  const dur = 750
  const frame = now => {
    if (anim !== token) return
    const t = ease(Math.min(1, (now - t0) / dur))
    L.ids.forEach(id => {
      cur[id].x = from[id].x + (L.pos[id].x - from[id].x) * t
      cur[id].y = from[id].y + (L.pos[id].y - from[id].y) * t
    })
    view = { cx: vFrom.cx + (vTo.cx - vFrom.cx) * t, cy: vFrom.cy + (vTo.cy - vFrom.cy) * t, w: vFrom.w + (vTo.w - vFrom.w) * t }
    drawAll()
    applyView()
    if (t < 1) requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
}
/* ## Search, dimming and refresh ## */
const matches = n => {
  if (!query) return true
  const hay = [n.name, n.sub, n.markers.join(" "), n.products.join(" "), n.roles.join(" "), n.notes, n.where].join(" ").toLowerCase()
  return hay.includes(query)
}

function refresh() {
  NODES.forEach(n => {
    const g = nodeEls[n.id]
    const shown = vis.has(n.id)
    const rel = selected && (n.id === selected || EDGES.some(e => (e.a === selected && e.b === n.id) || (e.b === selected && e.a === n.id)))
    g.classList.toggle("gone", !shown)
    g.classList.toggle("dim", shown && (!matches(n) || (!!selected && !rel)))
    g.classList.toggle("sel", n.id === selected)
  })
  edgeEls.forEach(it => {
    const { e, p, lab, lead } = it
    const shown = vis.has(e.a) && vis.has(e.b)
    const on = !!(shown && selected && (e.a === selected || e.b === selected))
    it.on = on
    p.classList.toggle("gone", !shown)
    p.classList.toggle("on", on)
    p.classList.toggle("off", shown && !!selected && !on)
    lab.setAttribute("visibility", on ? "visible" : "hidden")
    if (!on) lead.setAttribute("visibility", "hidden")
  })
  placeLabels()
}

/* ## Side panel ## */
const list = a => a.map(x => `<p>${x}</p>`).join("")
const tags = a => `<div class="tags">${a.map(x => `<span class="tag">${x}</span>`).join("")}</div>`

function relRows(id) {
  const rows = []
  EDGES.forEach(e => {
    if (e.a === id) rows.push({ other: e.b, out: true, type: e.type, label: e.label })
    else if (e.b === id) rows.push({ other: e.a, out: false, type: e.type, label: e.label })
  })
  return rows.map(r => {
    const o = byId[r.other]
    const verb = r.out ? ETYPES[r.type].name.toLowerCase() : "receives from"
    return `<button class="rel" data-go="${o.id}" style="--c:${GROUPS[o.g].color}"><span class="dir">${r.out ? "→" : "←"}</span><b>${o.name}</b><span>${verb}${r.label ? ", " + r.label : ""}</span></button>`
  }).join("")
}

function legendHTML() {
  return Object.keys(ETYPES).map(k => {
    const t = ETYPES[k]
    const head = k === "supp" ? `<line x1="40" y1="1" x2="40" y2="11" stroke="${t.color}" stroke-width="3"/>` : `<path d="M36 1 L45 6 L36 11 Z" fill="${t.color}"/>`
    return `<div><svg viewBox="0 0 46 12"><line x1="2" y1="6" x2="38" y2="6" stroke="${t.color}" stroke-width="2" ${t.dash ? `stroke-dasharray="${t.dash}"` : ""}/>${head}</svg><span>${t.name}</span></div>`
  }).join("")
}

function showDefault() {
  panel.innerHTML = `<div id="hint"><h2>Pick a cell</h2>
  <p>Click a cell and its connections light up, each arrow labelled with what the cell does to its neighbour. The panel then fills with markers, location, function and a few things worth knowing.</p>
  <h3>Controls</h3>
  <p>Lineage, Categories, or Network layouts. Chips hide a family. Focus on selection isolates a cell's inputs and outputs. Double-click to focus, drag to pan, scroll to zoom, search by name, marker, or function, Esc to clear.</p></div>`
}

function showNode(n) {
  panel.innerHTML = `<svg class="hero" viewBox="-62 -62 124 124" aria-hidden="true">${n.svg}</svg>
  <span class="badge" style="--c:${GROUPS[n.g].color}">${GROUPS[n.g].name}</span>
  <h2>${n.name}</h2><p class="sub">${n.sub}</p>
  <h3>Markers and identity</h3>${tags(n.markers)}
  <h3>Where</h3><p>${n.where}</p>
  <h3>What it does</h3>${list(n.roles)}
  <h3>Products and mediators</h3>${tags(n.products)}
  <h3>Worth knowing</h3><div class="note">${n.notes}</div>
  <h3>Relationships (click to jump)</h3><div>${relRows(n.id)}</div>`
  panel.scrollTop = 0
  panel.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(b.dataset.go)))
}

const focusBtn = document.getElementById("focusBtn")
function select(id) {
  selected = id
  if (id) showNode(byId[id])
  else showDefault()
  focusBtn.disabled = !id
  focusBtn.title = id ? "Arrange inputs left and outputs right of this cell (or double-click a cell)" : "Select a cell first"
  try { history.replaceState(null, "", id ? "#" + id : location.pathname) } catch (err) {}
  if (focus) applyLayout(false)
  else refresh()
}

/* ## Controls ## */
const chips = document.getElementById("chips")
Object.keys(GROUPS).forEach(k => {
  const b = document.createElement("button")
  b.className = "chip"
  b.setAttribute("aria-pressed", "true")
  b.style.setProperty("--c", GROUPS[k].color)
  b.innerHTML = `<i></i>${GROUPS[k].name}`
  b.addEventListener("click", () => {
    if (hiddenGroups.has(k)) hiddenGroups.delete(k)
    else hiddenGroups.add(k)
    b.setAttribute("aria-pressed", hiddenGroups.has(k) ? "false" : "true")
    if (selected && hiddenGroups.has(byId[selected].g)) { selected = null; showDefault(); focusBtn.disabled = true }
    applyLayout(false)
  })
  chips.appendChild(b)
})
document.querySelectorAll("#layout button").forEach(b => {
  b.addEventListener("click", () => {
    mode = b.dataset.mode
    document.querySelectorAll("#layout button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"))
    applyLayout(false)
  })
})
function setFocus(on) {
  focus = on
  focusBtn.setAttribute("aria-pressed", on ? "true" : "false")
  applyLayout(false)
}
focusBtn.addEventListener("click", () => setFocus(!focus))
document.getElementById("fitBtn").addEventListener("click", () => applyLayout(false))
const search = document.getElementById("search")
search.addEventListener("input", () => { query = search.value.trim().toLowerCase(); refresh() })
search.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && query) {
    const m = NODES.find(n => matches(n) && vis.has(n.id))
    if (m) select(m.id)
  }
})
document.addEventListener("keydown", ev => { if (ev.key === "Escape") select(null) })
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1)
  if (byId[id] && !hiddenGroups.has(byId[id].g)) select(id)
})

/* ## Pan and zoom ## */
let drag = null
svg.addEventListener("pointerdown", ev => {
  anim = null
  drag = { x: ev.clientX, y: ev.clientY, cx: view.cx, cy: view.cy, moved: false }
  svg.setPointerCapture(ev.pointerId)
})
svg.addEventListener("pointermove", ev => {
  if (!drag) return
  const dx = ev.clientX - drag.x
  const dy = ev.clientY - drag.y
  if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; svg.classList.add("panning") }
  if (!drag.moved) return
  const k = view.w / stage.clientWidth
  view.cx = drag.cx - dx * k
  view.cy = drag.cy - dy * k
  applyView()
})
svg.addEventListener("pointerup", () => {
  if (drag && !drag.moved) select(null)
  drag = null
  svg.classList.remove("panning")
})
svg.addEventListener("wheel", ev => {
  ev.preventDefault()
  anim = null
  const W = stage.clientWidth
  const H = stage.clientHeight
  const r = svg.getBoundingClientRect()
  const h = view.w * H / W
  const px = view.cx - view.w / 2 + (ev.clientX - r.left) / W * view.w
  const py = view.cy - h / 2 + (ev.clientY - r.top) / H * h
  const nw = Math.min(4000, Math.max(320, view.w * Math.exp(ev.deltaY * 0.0015)))
  const s = nw / view.w
  view.cx = px - (px - view.cx) * s
  view.cy = py - (py - view.cy) * s
  view.w = nw
  applyView()
}, { passive: false })

/* ## Start ## */
const edgeLegendEl = document.getElementById("edgeLegend")
const startCollapsed = window.innerWidth <= 900
edgeLegendEl.classList.toggle("collapsed", startCollapsed)
edgeLegendEl.innerHTML = `<button class="legend-toggle" id="legendToggle">Edge types ${startCollapsed ? "▸" : "▾"}</button><div class="legend">${legendHTML()}</div>`
document.getElementById("legendToggle").addEventListener("click", () => {
  const collapsed = edgeLegendEl.classList.toggle("collapsed")
  document.getElementById("legendToggle").textContent = "Edge types " + (collapsed ? "▸" : "▾")
})
const start = location.hash.slice(1)
if (byId[start]) { selected = start; showNode(byId[start]); focusBtn.disabled = false } else showDefault()
applyLayout(true)
let lastW = stage.clientWidth
new ResizeObserver(() => {
  if (stage.clientWidth !== lastW) { lastW = stage.clientWidth; applyLayout(true) }
  else applyView()
}).observe(stage)
</script>
</body>
